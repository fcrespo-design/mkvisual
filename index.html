<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MK Visual</title>
  <meta name="description" content="MK Visual — sitio en construcción.">
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    :root { --bg: #0e0e0e; --fg: #f5f5f5; --muted: #8a8a8a; --line: #2a2a2a; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      background: var(--bg); color: var(--fg);
      font-family: Inter, system-ui, -apple-system, sans-serif;
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      padding: 24px 16px; text-align: center;
    }
    h1 {
      font-weight: 800; letter-spacing: -0.04em; line-height: 0.9;
      font-size: clamp(56px, 16vw, 168px);
    }
    .line { width: 48px; height: 2px; background: var(--fg); margin: 32px auto; }
    p { color: var(--muted); font-size: 15px; letter-spacing: 0.18em; text-transform: uppercase; font-weight: 600; }
    footer { position: fixed; bottom: 24px; left: 0; right: 0; color: var(--line); font-size: 12px; }
  </style>
</head>
<body>
  <h1>MK<br>Visual</h1>
  <div class="line"></div>
  <p>Sitio en construcción</p>
  <footer>mkvisual.cl</footer>
</body>
</html>
