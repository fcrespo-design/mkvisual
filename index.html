<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MK Visual</title>
  <meta name="description" content="MK Visual — sitio en construcción.">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#000000">
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="apple-touch-icon" href="/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@200;300&display=swap" rel="stylesheet">
  <style>
    :root { --bg: #000000; --fg: #ffffff; --red: #ae0305; --muted: #7a7a7a; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      background: var(--bg); color: var(--fg);
      font-family: "Josefin Sans", system-ui, sans-serif; font-weight: 300;
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      padding: 24px 16px; text-align: center;
    }
    .logo { width: min(640px, 88vw); height: auto; display: block; }
    .line { width: 56px; height: 2px; background: var(--red); margin: 40px auto 28px; }
    p { color: var(--muted); font-size: 14px; letter-spacing: 0.32em; text-transform: uppercase; }
    footer { position: fixed; bottom: 24px; left: 0; right: 0; color: #333; font-size: 12px; letter-spacing: 0.2em; }
  </style>
</head>
<body>
  <h1><img class="logo" src="/logo.png" alt="MK Visual" width="1289" height="270"></h1>
  <div class="line"></div>
  <p>Sitio en construcción</p>
  <footer>MKVISUAL.CL</footer>
</body>
</html>
